<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px; padding: 18px 18px 16px;
      background: #12121a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.3); margin-bottom: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 12px 14px; }
    .left { display: flex; align-items: center; gap: 10px; }
    .icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(239,83,80,.15); border: 1px solid rgba(239,83,80,.3); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .text-wrap { display: flex; flex-direction: column; gap: 2px; }
    .name { font-size: 13px; font-weight: 600; color: #fff; }
    .status { font-size: 11px; color: rgba(255,255,255,.35); transition: color .25s; }
    .status.on { color: #66d991; }
    .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
    .switch input { display: none; }
    .track { position: absolute; inset: 0; background: rgba(255,255,255,.12); border-radius: 13px; cursor: pointer; transition: background .25s; border: 1px solid rgba(255,255,255,.08); }
    .track::before { content: ''; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; background: rgba(255,255,255,.5); border-radius: 50%; transition: transform .25s, background .25s; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
    input:checked + .track { background: #ef5350; border-color: rgba(239,83,80,.4); }
    input:checked + .track::before { transform: translateX(20px); background: #fff; }
    .hint { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,.2); text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="title" style="display:flex;align-items:center;gap:7px;"><img src="icons/icon32.png" width="18" height="18" style="border-radius:4px;vertical-align:middle"> Focus Timer</div>
  <div class="row">
    <div class="left">
      <div class="icon">⏱</div>
      <div class="text-wrap">
        <span class="name">Timer flotante</span>
        <span class="status" id="status">Visible</span>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <div class="track"></div>
    </label>
  </div>
  <p class="hint" id="hint">Arrastra el timer a cualquier esquina</p>
  <script src="popup.js"></script>
</body>
</html>
