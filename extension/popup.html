<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 252px;
      background: #12121a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Header ── */
    .hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 13px 16px 11px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .hdr-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: rgba(255,255,255,.55); }

    /* ── Timer section ── */
    .timer-sect {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .mode-badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: var(--c, #ff6b6b); margin-bottom: 6px;
    }
    .dot {
      width: 5px; height: 5px; border-radius: 50%; background: currentColor;
      box-shadow: 0 0 5px currentColor;
    }
    .dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
    .time-val {
      font-size: 38px; font-weight: 800; letter-spacing: -1.5px;
      color: var(--c, #ff6b6b); font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px color-mix(in srgb, var(--c, #ff6b6b) 40%, transparent);
      line-height: 1;
    }
    .time-val.idle { color: rgba(255,255,255,.18); text-shadow: none; font-size: 28px; letter-spacing: -1px; }
    .sess-info {
      font-size: 10px; color: rgba(255,255,255,.25); margin-top: 5px; letter-spacing: .03em;
    }

    /* ── Toggle row ── */
    .row {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,.03); border-radius: 10px;
      padding: 10px 12px; margin: 10px 12px 0;
    }
    .left { display: flex; align-items: center; gap: 9px; }
    .icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: rgba(239,83,80,.12); border: 1px solid rgba(239,83,80,.25);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .name { font-size: 12px; font-weight: 600; color: #fff; }
    .status { font-size: 10px; color: rgba(255,255,255,.3); transition: color .25s; margin-top: 1px; }
    .status.on { color: #66d991; }

    /* toggle switch */
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { display: none; }
    .track {
      position: absolute; inset: 0; background: rgba(255,255,255,.1);
      border-radius: 11px; cursor: pointer; transition: background .25s;
      border: 1px solid rgba(255,255,255,.07);
    }
    .track::before {
      content: ''; position: absolute; width: 16px; height: 16px;
      left: 2px; top: 2px; background: rgba(255,255,255,.45); border-radius: 50%;
      transition: transform .25s, background .25s; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    input:checked + .track { background: #ef5350; border-color: rgba(239,83,80,.4); }
    input:checked + .track::before { transform: translateX(18px); background: #fff; }

    .hint {
      font-size: 10px; color: rgba(255,255,255,.18); text-align: center;
      padding: 8px 16px 14px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="hdr">
    <img src="icons/icon32.png" width="16" height="16" style="border-radius:4px">
    <span class="hdr-title">Focus Timer</span>
  </div>

  <!-- Timer state -->
  <div class="timer-sect" id="timer-sect">
    <div class="mode-badge"><div class="dot" id="dot"></div><span id="mode-lbl">—</span></div>
    <div class="time-val idle" id="time-val">—</div>
    <div class="sess-info" id="sess-info"></div>
  </div>

  <!-- Visibility toggle -->
  <div class="row">
    <div class="left">
      <div class="icon">⏱</div>
      <div>
        <div class="name">Floating timer</div>
        <div class="status" id="status">Hidden</div>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <div class="track"></div>
    </label>
  </div>

  <p class="hint" id="hint">Enable to show the timer on every tab</p>

  <script src="popup.js"></script>
</body>
</html>
